name: CI/CD Pipeline (Main -> Staging -> Production)

on:
  workflow_dispatch:
    inputs:
      target_env:
      
        description: 'Target Environment to Deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - main
      - staging

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Check Actor
        id: skip_check
        run: |
          if [ "${{ github.actor }}" == "github-actions[bot]" ]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  verify_source:
    needs: guard
    if: needs.guard.outputs.should_skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check for Unverified Commits on Source
        uses: nadock/verified_commits_check@v1

  deploy_to_staging:
    needs: verify_source
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Strip Development Files
        run: |
          rm -rf .vscode
          rm -f .gitignore
          rm -f README.md
          rm -f todo

      - name: Set Up Git User
        run: |
          git config --local user.email "noreply@zayedkherani.com"
          git config --local user.name "GitHub Action"

      - name: Import GPG Signing Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          trust_level: 5

      - name: Push to Staging Branch
        run: |
          git checkout -B staging
          git add .
          COMMIT_MSG="staging: $(git log main -1 --pretty=%B)"
          git commit --signoff -m "$COMMIT_MSG"
          git push -f origin staging

  deploy_to_production:
    needs: verify_source
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production')
    steps:
      - name: Checkout Staging Branch
        uses: actions/checkout@v7
        with:
          ref: staging
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Strip Workflows & Remaining Dev Artifacts
        run: |
          rm -rf .vscode
          rm -f .gitignore
          rm -f README.md
          rm -f todo
          rm -rf .github  # Remove workflows so production doesn't expose them

      - name: Set Up Git User
        run: |
          git config --local user.email "noreply@zayedkherani.com"
          git config --local user.name "GitHub Action"

      - name: Import GPG Signing Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          trust_level: 5

      - name: Push to Production Branch
        run: |
          git checkout -B production
          git add .
          COMMIT_MSG="production: $(git log staging -1 --pretty=%B)"
          git commit --signoff -m "$COMMIT_MSG"
          git push -f origin production